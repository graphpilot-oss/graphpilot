name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      - run: pnpm build

      # Test tags (e.g. v0.0.1-test) publish under --tag test, not latest
      - name: Publish (test tag)
        if: contains(github.ref_name, '-test')
        run: pnpm publish --no-git-checks --tag test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Real releases publish normally with provenance
      - name: Publish (release)
        if: "!contains(github.ref_name, '-test')"
        run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Official MCP Registry (registry.modelcontextprotocol.io) ---
      # Real releases only. Uses GitHub OIDC (no extra secrets); the
      # io.github.graphpilot-oss/* namespace is authorized because this
      # workflow runs in the graphpilot-oss org. Validation reads the npm
      # package published above, which carries the matching `mcpName`.
      - name: Sync server.json version to tag
        if: "!contains(github.ref_name, '-test')"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        if: "!contains(github.ref_name, '-test')"
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        if: "!contains(github.ref_name, '-test')"
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Only create a GitHub Release for real tags, not test ones
      - uses: softprops/action-gh-release@v3
        if: "!contains(github.ref_name, '-test')"
        with:
          generate_release_notes: true
